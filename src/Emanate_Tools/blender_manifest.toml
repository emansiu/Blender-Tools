schema_version = "1.0.1"

id = "Emanate_Studios_Tools"
version = "1.1.2"
name = "Emanate Studios by Emanuel Siu"
tagline = "Blender Tools by Emanuel Siu"
maintainer = "Emanuel <e@emanuelsiu.com>"
type = "add-on"

blender_version_min = "4.2.0"
